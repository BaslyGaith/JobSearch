spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobfinder}
    username: ${DATABASE_USERNAME:jobfinder}
    password: ${DATABASE_PASSWORD:jobfinder}
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-secret}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          microsoft:
            client-id: ${MICROSOFT_CLIENT_ID:dummy-microsoft-client-id}
            client-secret: ${MICROSOFT_CLIENT_SECRET:dummy-microsoft-secret}
            scope: openid,profile,email,User.Read
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  frontend-url: ${APP_FRONTEND_URL:${FRONTEND_URL:http://localhost:5173}}
  linkedin:
    mock-mode: ${LINKEDIN_MOCK_MODE:true}
    client-id: ${LINKEDIN_CLIENT_ID:}
    client-secret: ${LINKEDIN_CLIENT_SECRET:}
    redirect-uri: ${LINKEDIN_REDIRECT_URI:http://localhost:8080/api/linkedin/callback}
  sources:
    # Company career pages on Greenhouse / Lever expose public JSON feeds.
    # List the board tokens you want followed, comma separated.
    greenhouse:
      boards: ${GREENHOUSE_BOARDS:}
    lever:
      companies: ${LEVER_COMPANIES:}
    # France Travail "Offres d'emploi v2" - credentials from francetravail.io.
    france-travail:
      client-id: ${FRANCE_TRAVAIL_CLIENT_ID:}
      client-secret: ${FRANCE_TRAVAIL_CLIENT_SECRET:}
  cv:
    ollama:
      enabled: ${CV_OLLAMA_ENABLED:true}
      base-url: ${CV_OLLAMA_URL:http://localhost:11434}
      model: ${CV_OLLAMA_MODEL:llama3}

logging:
  level:
    com.jobfinder: DEBUG
    org.springframework.security: INFO
